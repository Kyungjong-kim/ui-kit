name: 기능 요청
description: 새 컴포넌트, prop, variant 또는 개선을 요청합니다.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ui-kit 개선 제안을 환영합니다. 구현 전 이슈로 먼저 논의해 주세요.

  - type: dropdown
    id: type
    attributes:
      label: 요청 유형
      options:
        - 새 컴포넌트
        - 새 prop / variant
        - 기존 컴포넌트 개선
        - 접근성 개선
        - 성능 개선
        - 기타
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 상세설명
      description: 추가 기능과 사용자 가치를 2~4문장으로 요약
      placeholder: "어떤 기능이 필요하고, 왜 필요한가요?"
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: Background
      description: 기획 배경, 현재 문제점, 사용자 요구
      placeholder: "현재 어떤 불편함이 있어서 이 기능이 필요한가요?"
    validations:
      required: true

  - type: textarea
    id: todo
    attributes:
      label: To Do
      description: 구현 항목 체크리스트
      value: |
        - [ ] 유사 컴포넌트 분석
        - [ ] 구현 계획 수립
        - [ ] 컴포넌트 구현 (5개 산출물)
        - [ ] 스토리북 확인
        - [ ] `pnpm test` / `pnpm build` 통과

  - type: textarea
    id: see_also
    attributes:
      label: See Also
      description: 기획서, 디자인 시안, 참고 라이브러리 등
      placeholder: "예: Radix UI Accordion — https://..."
