name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Blocking DS gates. Each catches a class of drift that lint and build let through:
      #  - typography: Tailwind v4 drops undefined utilities silently (font never applies)
      #  - tokens:     raw hex/rgb bypasses the token layer, so theming skips the element
      #  - catalog:    ds-catalog.json and the README inventory fall behind the source
      - name: Check design system
        run: pnpm check:ds

      # Advisory. Every finding needs a human decision, so it reports into the job
      # summary instead of failing — a gate that fires on judgement calls gets muted.
      - name: Report documentation drift
        if: always()
        continue-on-error: true
        run: |
          REPORT=$(pnpm check:docs || true)
          echo "$REPORT"
          {
            echo '```'
            echo "$REPORT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  storybook:
    name: Build Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm build-storybook

      # 공개 배포물 식별자 게이트 — 소스가 아닌 빌드 산출물을 검사해야
      # 스토리 더미 데이터에 박힌 식별자까지 잡힌다(#153 재발 방지).
      - name: Masking gate (배포물 식별자 0건 검증)
        run: |
          if grep -rliE 'genos|genon|gen-portal|admin-front|0161ed' storybook-static; then
            echo "::error::공개 배포물에서 마스킹 대상 식별자 검출 — 위 파일 확인"
            exit 1
          fi
          echo "masking gate pass"

      - name: Upload Storybook artifact
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-static
          retention-days: 7

  deploy-storybook:
    name: Deploy Storybook (GitHub Pages)
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: storybook
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Download Storybook artifact
        uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: storybook-static

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
